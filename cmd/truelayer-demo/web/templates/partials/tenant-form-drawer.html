{{define "tenant-form-drawer"}}
<div class="entity-drawer-backdrop"><section class="entity-drawer tenant-drawer" role="dialog" aria-modal="true" aria-labelledby="tenant-form-title">
  <div class="panel-head"><div><h2 id="tenant-form-title">{{if .Editing}}编辑租客资料{{else}}新增租客{{end}}</h2><p class="tiny">租客资料用于识别人和联系信息；入住与租金在房间详情中维护。</p></div><a class="drawer-close" href="{{.ReturnURL}}" aria-label="关闭租客表单">×</a></div>
  {{if .Error}}<div class="notice error" role="alert">请检查租客姓名、邮箱和付款人资料。</div>{{end}}
  <form method="post" action="/tenants">
    <input type="hidden" name="return_to" value="{{.PostReturnURL}}">
    {{if .Editing}}<input type="hidden" name="tenant_id" value="{{.Form.ID}}">{{end}}
    <fieldset class="tenant-form-section"><legend>人员资料</legend>
      <label for="name">租客姓名</label>
      <input id="name" name="name" autocomplete="name" value="{{.Form.Name}}" maxlength="191" required>
      <label for="display_alias">显示别名</label>
      <input id="display_alias" name="display_alias" value="{{.Form.DisplayAlias}}" maxlength="191" placeholder="列表优先显示的称呼">
      <label for="email">邮箱</label>
      <input id="email" name="email" type="email" autocomplete="email" value="{{.Form.Email}}" placeholder="tenant@example.com">
    </fieldset>
    <fieldset class="tenant-form-section"><legend>付款人识别（可选）</legend>
      <label for="payer_id">银行付款人编号</label>
      <input id="payer_id" name="payer_id" value="{{.Form.PayerID}}" maxlength="191">
      <label for="payer_name_hint">付款人名称</label>
      <input id="payer_name_hint" name="payer_name_hint" value="{{.Form.PayerNameHint}}" maxlength="191">
    </fieldset>
    <input type="hidden" name="status" value="{{if .Form.Status}}{{.Form.Status}}{{else}}active{{end}}">
    <div class="drawer-actions"><a class="btn subtle" href="{{.ReturnURL}}">取消</a><button class="btn primary" type="submit">{{if .Editing}}保存更改{{else}}保存租客{{end}}</button></div>
  </form>
</section></div>
{{end}}
