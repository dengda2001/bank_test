{{define "expense-form-drawer"}}
<div class="entity-drawer-backdrop expense-drawer-backdrop">
  <section class="entity-drawer expense-drawer" role="dialog" aria-modal="true" aria-labelledby="expense-create-title">
    <div class="panel-head"><div><h2 id="expense-create-title">新增支出</h2><p class="tiny">支出按房产归集，房间为可选关联对象。</p></div><a class="drawer-close" href="{{.ReturnURL}}" aria-label="关闭新增支出">×</a></div>
    {{if .Error}}<div class="notice error" role="alert">{{if eq .Error "invalid_form"}}表单无效，请检查支出信息。{{else}}支出记录未保存，请检查描述、金额和房产。{{end}}</div>{{end}}
    {{if not .Properties}}<div class="notice error">请先建立房产，再新增房产支出。</div>{{end}}
    <form method="post" action="/expenses">
      <input type="hidden" name="return_to" value="{{.PostReturnURL}}">
      <input type="hidden" name="period" value="{{.Period}}">
      <div class="form-field"><label for="expense-description">支出描述</label><input id="expense-description" name="description" maxlength="191" required autofocus></div>
      <div class="expense-form-grid"><div class="form-field"><label for="expense-amount">金额</label><input id="expense-amount" name="amount" type="number" min="0.01" step="0.01" inputmode="decimal" required></div><div class="form-field"><label for="expense-category">类别</label><select id="expense-category" name="category"><option>维修</option><option>水电</option><option>清洁</option><option>保险</option><option>其他</option></select></div></div>
      <div class="form-field"><label for="expense-property">所属房产</label><select id="expense-property" name="property_id" required{{if not .Properties}} disabled{{end}}><option value="">请选择房产</option>{{range .Properties}}<option value="{{.ID}}"{{if eq $.SelectedPropertyID .ID}} selected{{end}}>{{.Name}}</option>{{end}}</select></div>
      {{if .Rooms}}<div class="form-field"><label for="expense-room">关联房间（可选）</label><select id="expense-room" name="room_id"><option value="">房产级支出</option>{{range .Rooms}}<option value="{{.ID}}" data-property="{{.PropertyID}}"{{if eq $.SelectedRoomID .ID}} selected{{end}}>{{.Label}}</option>{{end}}</select></div>{{end}}
      <div class="expense-form-grid"><div class="form-field"><label for="expense-date">日期</label><input id="expense-date" name="expense_date" type="date" value="{{.Today}}" required></div><div class="form-field"><label for="expense-payment">付款方式</label><input id="expense-payment" name="payment_method" value="手动"></div></div>
      <input type="hidden" name="currency" value="EUR">
      <details class="expense-extra-fields"><summary>添加备注</summary><div class="expense-form-grid"><div class="form-field"><label for="expense-room-note">房间备注</label><input id="expense-room-note" name="room_hint"></div><div class="form-field"><label for="expense-tenant-note">租客备注</label><input id="expense-tenant-note" name="tenant_hint"></div></div></details>
      <div class="drawer-actions"><a class="btn subtle" href="{{.ReturnURL}}">取消</a><button class="btn primary" type="submit"{{if not .Properties}} disabled{{end}}>保存支出</button></div>
    </form>
  </section>
</div>
<script>
(() => {
  const backdrop = document.querySelector(".expense-drawer-backdrop");
  const drawer = backdrop?.querySelector(".expense-drawer");
  if (!backdrop || !drawer) return;
  const close = drawer.querySelector(".drawer-close");
  drawer.querySelector("input:not([type=hidden]):not([type=file])")?.focus();
  backdrop.addEventListener("click", (event) => {
    if (event.target === backdrop && close) window.location.assign(close.href);
  });
  document.addEventListener("keydown", (event) => {
    if (event.key === "Escape" && close) window.location.assign(close.href);
  });
  const property = drawer.querySelector("#expense-property");
  const room = drawer.querySelector("#expense-room");
  const syncRooms = () => {
    if (!property || !room) return;
    Array.from(room.options).forEach((option) => {
      if (!option.dataset.property) return;
      option.disabled = property.value !== "" && option.dataset.property !== property.value;
    });
    const selected = room.options[room.selectedIndex];
    if (selected?.hidden) room.value = "";
  };
  property?.addEventListener("change", syncRooms);
  syncRooms();
})();
</script>
{{end}}
